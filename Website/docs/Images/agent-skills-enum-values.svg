<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="534" viewBox="0 0 1120 534" fill="none">
  <title>Agent session with the aspid-enum-values skill</title>
  <desc>The request "Add a damage multiplier per DamageType to the Inspector" loads the aspid-enum-values skill by itself, and the agent edits DamageReceiver.cs.</desc>
