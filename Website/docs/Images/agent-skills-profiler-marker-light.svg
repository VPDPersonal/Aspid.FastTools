<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="498" viewBox="0 0 1120 498" fill="none">
  <title>Agent session with the aspid-profiler-marker skill</title>
  <desc>The request "Profile Simulate and the neighbor search" loads the aspid-profiler-marker skill by itself, and the agent edits FlockSimulation.cs.</desc>
  <rect x="1" y="1" width="1118" height="496" rx="12" fill="#ffffff" stroke="#e3e4e8"/>
  <path d="M13 1H1107A12 12 0 0 1 1119 13V56H1V13A12 12 0 0 1 13 1Z" fill="#f7f7f8"/>
  <path d="M1 56H1119M1 222H1119" stroke="#e3e4e8"/>
  <g font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace">
    <text x="28" y="36" font-size="17" letter-spacing="2" fill="#5f636b">AGENT</text>
    <text x="1092" y="36" font-size="17" letter-spacing="2" text-anchor="end" fill="#5f636b">FLOCKSIMULATION.CS</text>
    <rect x="24" y="78" width="1072" height="50" rx="8" stroke="#e3e4e8" stroke-width="2"/>
    <text x="44" y="111" font-size="20" font-weight="600" fill="#c2603f">&gt;</text>
    <text x="72" y="111" font-size="20" fill="#2a2c31">Profile Simulate and the neighbor search</text>
    <circle cx="36" cy="145" r="6" fill="#22a04b"/>
    <text x="56" y="152" font-size="19" fill="#2a2c31">Skill <tspan font-weight="600" fill="#2a2c31">aspid-profiler-marker</tspan></text>
    <circle cx="36" cy="185" r="6" fill="#22a04b"/>
    <text x="56" y="192" font-size="19" fill="#2a2c31">Update <tspan font-weight="600" fill="#2a2c31">FlockSimulation.cs</tspan> <tspan fill="#1d8840">+2</tspan></text>
    <text x="28" y="256" font-size="20" xml:space="preserve"><tspan fill="#b24d05">public</tspan><tspan fill="#2a2c31"> </tspan><tspan fill="#b24d05">void</tspan><tspan fill="#2a2c31"> </tspan><tspan fill="#916204">Simulate</tspan><tspan fill="#2a2c31">(</tspan><tspan fill="#2a2c31">)</tspan></text>
    <text x="28" y="292" font-size="20" xml:space="preserve"><tspan fill="#2a2c31">{</tspan></text>
    <rect x="1" y="303" width="1118" height="36" fill="#22a04b" fill-opacity="0.12"/>
    <path d="M2 303V339" stroke="#22a04b" stroke-width="3"/>
    <text x="28" y="328" font-size="20" xml:space="preserve"><tspan fill="#2a2c31">    </tspan><tspan fill="#b24d05">using</tspan><tspan fill="#2a2c31"> </tspan><tspan fill="#b24d05">var</tspan><tspan fill="#2a2c31"> </tspan><tspan fill="#2a2c31">_</tspan><tspan fill="#2a2c31"> </tspan><tspan fill="#b24d05">=</tspan><tspan fill="#2a2c31"> </tspan><tspan fill="#b24d05">this</tspan><tspan fill="#2a2c31">.</tspan><tspan fill="#916204">Marker</tspan><tspan fill="#2a2c31">(</tspan><tspan fill="#2a2c31">)</tspan><tspan fill="#2a2c31">;</tspan></text>
    <rect x="1" y="339" width="1118" height="36" fill="#22a04b" fill-opacity="0.12"/>
    <path d="M2 339V375" stroke="#22a04b" stroke-width="3"/>
    <text x="28" y="364" font-size="20" xml:space="preserve"><tspan fill="#2a2c31">    </tspan><tspan fill="#b24d05">using</tspan><tspan fill="#2a2c31"> </tspan><tspan fill="#2a2c31">(</tspan><tspan fill="#b24d05">this</tspan><tspan fill="#2a2c31">.</tspan><tspan fill="#916204">Marker</tspan><tspan fill="#2a2c31">(</tspan><tspan fill="#2a2c31">)</tspan><tspan fill="#2a2c31">.</tspan><tspan fill="#916204">WithName</tspan><tspan fill="#2a2c31">(</tspan><tspan fill="#3d7a00">"Neighbors"</tspan><tspan fill="#2a2c31">)</tspan><tspan fill="#2a2c31">)</tspan></text>
    <text x="28" y="400" font-size="20" xml:space="preserve"><tspan fill="#2a2c31">        </tspan><tspan fill="#916204">FindNeighbors</tspan><tspan fill="#2a2c31">(</tspan><tspan fill="#2a2c31">)</tspan><tspan fill="#2a2c31">;</tspan></text>
    <text x="28" y="436" font-size="20" xml:space="preserve"><tspan fill="#2a2c31">    </tspan><tspan fill="#916204">Integrate</tspan><tspan fill="#2a2c31">(</tspan><tspan fill="#2a2c31">)</tspan><tspan fill="#2a2c31">;</tspan></text>
    <text x="28" y="472" font-size="20" xml:space="preserve"><tspan fill="#2a2c31">}</tspan></text>
  </g>
</svg>
