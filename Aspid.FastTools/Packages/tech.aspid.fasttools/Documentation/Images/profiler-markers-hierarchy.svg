<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="306" viewBox="0 0 1120 306" fill="none">
  <title>FlockSimulation marker hierarchy</title>
  <desc>Step (3) contains Steering (5) and Integrate (14). Steering contains Steering.Agent (9), called 120 times. The other markers are called once. All allocate 0 B. Example times: Step 0.38 ms, Steering 0.37 ms, Steering.Agent 0.36 ms, Integrate 0.01 ms.</desc>
  <rect x="1" y="1" width="1118" height="304" rx="12" fill="#0e1015"/>
  <path d="M13 1H1107A12 12 0 0 1 1119 13V72H1V13A12 12 0 0 1 13 1Z" fill="#14171e"/>
  <path d="M1 72H1119M1 126H1119M660 72V126M800 72V126M960 72V126" stroke="#272b35"/>
  <path d="M28 39H35L41 27L49 49L56 35H66" stroke="#75c584" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace">
    <text x="84" y="45" font-size="23" fill="#e1e2e6">CPU Usage</text>
    <path d="M236 31L243 38L236 45" stroke="#92959f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="264" y="45" font-size="23" fill="#92959f">Hierarchy</text>
    <text x="30" y="106" font-size="18" fill="#92959f">Marker</text>
    <text x="730" y="106" font-size="18" text-anchor="middle" fill="#92959f">Calls</text>
    <text x="880" y="106" font-size="18" text-anchor="middle" fill="#92959f">GC Alloc</text>
    <text x="1040" y="106" font-size="18" text-anchor="middle" fill="#92959f">Time ms</text>
    <path d="M43 169V274H72M43 194H72M83 208V234H112" stroke="#272b35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <g font-size="23" fill="#e1e2e6">
      <text x="63" y="164">FlockSimulation.Step <tspan fill="#92959f">(3)</tspan></text>
      <text x="103" y="204">FlockSimulation.Steering <tspan fill="#92959f">(5)</tspan></text>
      <text x="143" y="244">FlockSimulation.Steering.Agent <tspan fill="#92959f">(9)</tspan></text>
      <text x="103" y="284">FlockSimulation.Integrate <tspan fill="#92959f">(14)</tspan></text>
      <text x="730" y="164" text-anchor="middle" fill="#92959f">1</text>
      <text x="880" y="164" text-anchor="middle">0 B</text>
      <text x="1040" y="164" text-anchor="middle" fill="#92959f">0.38</text>
      <text x="730" y="204" text-anchor="middle" fill="#92959f">1</text>
      <text x="880" y="204" text-anchor="middle">0 B</text>
      <text x="1040" y="204" text-anchor="middle" fill="#92959f">0.37</text>
      <text x="730" y="244" text-anchor="middle" fill="#92959f">120</text>
      <text x="880" y="244" text-anchor="middle">0 B</text>
      <text x="1040" y="244" text-anchor="middle" fill="#92959f">0.36</text>
      <text x="730" y="284" text-anchor="middle" fill="#92959f">1</text>
      <text x="880" y="284" text-anchor="middle">0 B</text>
      <text x="1040" y="284" text-anchor="middle" fill="#92959f">0.01</text>
    </g>
  </g>
  <g fill="#75c584">
    <path d="M36 152H50L43 160Z"/>
    <path d="M76 192H90L83 200Z"/>
    <circle cx="123" cy="236" r="4"/>
    <circle cx="83" cy="276" r="4"/>
  </g>
  <rect x="1" y="1" width="1118" height="304" rx="12" stroke="#272b35" stroke-width="2"/>
</svg>
