# One grouped PR per ecosystem a month (npm majors in their own group). The Roslyn packages of Aspid.FastTools.Generators/Analyzers are not
# listed: their versions must match the compiler Unity ships.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
      include: scope
    labels: ['dependencies', 'type: ci', 'area: ci']

  - package-ecosystem: npm
    directory: /Website
    schedule:
      interval: monthly
    groups:
      website:
        patterns: ['*']
        update-types: [minor, patch]
      website-major:
        patterns: ['*']
        update-types: [major]
    commit-message:
      prefix: chore
      include: scope
    labels: ['dependencies', 'type: chore', 'area: docs']
