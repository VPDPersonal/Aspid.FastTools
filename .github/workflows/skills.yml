name: Skills

# Runs on every pull request, with no path filter: a path-filtered job is skipped, and a skipped required check stays
# pending. A PR that removes an analyzer code but touches no skill must still be checked against the skills.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: SKILL.md files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Not sparse: the check reads every SKILL.md and the analyzer sources.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund js-yaml@4
      - run: node scripts/check-skills.mjs
