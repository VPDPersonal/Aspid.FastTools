name: PR checks

# pull_request_target: runs the base branch's copy with a write token, so labels work on fork PRs too.
# It never checks out the PR's code — everything below reads the PR through the API only. The title job checks out
# scripts/ of the base branch, never of the PR, for the logic that scripts/*.test.mjs tests.
on:
  pull_request_target:
    # No ready_for_review: neither job depends on the draft state.
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

# Each job asks for its own permissions.
permissions: {}

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Conventional Commits title with a known scope; sets the type, breaking-change and area labels. A PR that takes a
  # member line out of the public API snapshot needs `!` in the title.
  title:
    name: PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The checkout needs contents; the labels need pull-requests and issues.
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const TYPES = {
              feat: 'type: feature', fix: 'type: fix', perf: 'type: performance', refactor: 'type: refactor',
              docs: 'type: documentation', test: 'type: test', chore: 'type: chore', ci: 'type: ci', style: 'type: style',
            };
            const SCOPES = [
              // features
              'types', 'ids', 'enums', 'serialize-references', 'profiler-markers', 'visual-elements', 'serialized-property',
              // layers
              'runtime', 'editor', 'generators', 'analyzers', 'samples', 'package',
              // repository
              'website', 'docs', 'changelog', 'release', 'ci', 'github', 'skills', 'claude', 'deps',
            ];
            // Longest prefix wins; a file can add several areas.
            const PKG = 'Aspid.FastTools/Packages/tech.aspid.fasttools/';
            const AREAS = [
              [PKG + 'Runtime/', 'area: runtime'],
              [PKG + 'Editor/', 'area: editor'],
              [PKG + 'Tests/Editor/', 'area: editor'],
              [PKG + 'Samples~/', 'area: samples'],
              [PKG + 'README.md', 'area: docs'],
              ['Aspid.FastTools.Generators/', 'area: generator'],
              ['Aspid.FastTools.Analyzers/', 'area: analyzer'],
              ['DotnetTests/Yaml/', 'area: editor'],
              ['DotnetTests/Types/', 'area: editor'],
              ['Aspid.FastTools/Assets/DevTests~/', 'area: editor'],
              ['Aspid.FastTools/Assets/DevTools/', 'area: editor'],
              ['Aspid.FastTools/Assets/SampleTests~/', 'area: samples'],
              ['Website/', 'area: website'],
              ['Website/docs/', 'area: docs'],
              ['Website/tutorials/', 'area: docs'],
              ['Website/i18n/', 'area: docs'],
              ['docs/', 'area: docs'],
              ['README', 'area: docs'],
              ['CHANGELOG', 'area: docs'],
              ['.claude/', 'area: claude'],
              ['skills/', 'area: claude'],
              ['AGENTS.md', 'area: claude'],
              ['.github/', 'area: ci'],
              ['scripts/', 'area: ci'],
            ];

            const { PUBLIC_API_PATH, PUBLIC_API_FORMAT_PATH, removedMemberLines, removedMemberLinesBetween, breakingTitleVerdict } =
              await import(`${process.env.GITHUB_WORKSPACE}/scripts/public-api-breaks.mjs`);

            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const title = pr.title;
            const errors = [];

            const m = /^([a-z]+)(?:\(([a-z0-9-]+)\))?(!)?: (.+)$/.exec(title);
            if (!m) errors.push('Title must be `type(scope): summary` (Conventional Commits).');
            else {
              const [, type, scope, , summary] = m;
              if (!TYPES[type]) errors.push(`Unknown type \`${type}\`; use one of: ${Object.keys(TYPES).join(', ')}.`);
              if (scope && !SCOPES.includes(scope)) errors.push(`Unknown scope \`${scope}\`; use one of: ${SCOPES.join(', ')} (or none).`);
              if (/\.$/.test(summary)) errors.push('Summary has no trailing period.');
            }
            if (title.length > 72) errors.push(`Title is ${title.length} characters; keep it within 72.`);

            // Labels are updated even when the title fails, so a later fix only has to touch the title.
            const current = pr.labels.map(l => l.name);
            const add = new Set();
            const remove = new Set();
            if (m && TYPES[m[1]]) {
              add.add(TYPES[m[1]]);
              current.filter(l => l.startsWith('type: ') && l !== TYPES[m[1]]).forEach(l => remove.add(l));
            }
            // The title alone decides breaking-change; an unparsable title leaves the label as it is.
            if (m?.[3]) add.add('breaking-change');
            else if (m && current.includes('breaking-change')) remove.add('breaking-change');

            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pr.number });
            for (const { filename } of files) {
              // GitHub finds these two in .github/, but they are contributor docs, not CI.
              if (filename === '.github/CONTRIBUTING.md' || filename === '.github/SECURITY.md') {
                add.add('area: docs');
                continue;
              }
              for (const [prefix, label] of AREAS)
                if (filename.startsWith(prefix)) add.add(label);
              // A nested AGENTS.md is agent configuration wherever it lives.
              if (filename.endsWith('/AGENTS.md')) add.add('area: claude');
            }
            // An area no changed file reaches any more (the PR moved on) loses its label.
            for (const label of new Set(AREAS.map(([, area]) => area)))
              if (current.includes(label) && !add.has(label)) remove.add(label);

            // A member line that leaves the public API snapshot is a break, and only the title can say so. A line that
            // only gains text is no loss. GitHub leaves `patch` out of a large diff; then the two versions of the file
            // are compared instead. A PR that changes the snapshot writer too only gets a warning.
            const apiFile = files.find(f => f.filename === PUBLIC_API_PATH);
            if (m && apiFile) {
              try {
                let removed;
                if (apiFile.patch !== undefined) removed = removedMemberLines(apiFile.patch);
                else if (apiFile.status === 'added') removed = [];
                else {
                  const read = async (o, r, path, ref) =>
                    String((await github.rest.repos.getContent({ owner: o, repo: r, path, ref, mediaType: { format: 'raw' } })).data);
                  const before = await read(owner, repo, apiFile.previous_filename ?? apiFile.filename, pr.base.sha);
                  const after = apiFile.status === 'removed'
                    ? ''
                    : await read(pr.head.repo.owner.login, pr.head.repo.name, apiFile.filename, pr.head.sha);
                  removed = removedMemberLinesBetween(before, after);
                }

                const formatChanged = files.some(f => f.filename === PUBLIC_API_FORMAT_PATH);
                const verdict = breakingTitleVerdict(removed, Boolean(m[3]), formatChanged);
                if (verdict.error) errors.push(verdict.error);
                if (verdict.warning) core.warning(verdict.warning);
              } catch (error) {
                // Not a failure of the PR: PublicApiSnapshotTests still compares the snapshot with the code.
                core.warning(`Could not read the changes of PublicApi.txt: ${error.message}`);
              }
            }

            const toAdd = [...add].filter(l => !current.includes(l));
            if (toAdd.length) await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: toAdd });
            for (const name of remove)
              await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name }).catch(() => {});

            if (errors.length) core.setFailed(errors.join('\n'));

  # User-visible package code changed → the same entry in CHANGELOG.md and Website/i18n/ru/CHANGELOG.md, or the `no-changelog` label.
  # The package copy and the release notes are built from the English file; the docs check needs both files to match.
  changelog:
    name: CHANGELOG
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Reads the PR only.
    permissions:
      pull-requests: read
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const PKG = 'Aspid.FastTools/Packages/tech.aspid.fasttools/';
            const pr = context.payload.pull_request;
            if (pr.labels.some(l => l.name === 'no-changelog')) return core.info('`no-changelog` label set.');

            const { owner, repo } = context.repo;
            const files = (await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pr.number }))
              .map(f => f.filename);
            const shipped = files.filter(f =>
              f.startsWith(PKG + 'Runtime/') || f.startsWith(PKG + 'Editor/') ||
              (f.startsWith(PKG + 'Samples~/') && !/^Samples~\/README(?:\.ru)?\.md$/.test(f.slice(PKG.length))) ||
              (f.startsWith(PKG) && /^(?:[^/]+\.dll|package\.json)$/.test(f.slice(PKG.length))));
            if (!shipped.length) return core.info('No shipped package code changed.');
            const english = files.includes('CHANGELOG.md'), russian = files.includes('Website/i18n/ru/CHANGELOG.md');
            if (english && russian) return core.info('CHANGELOG updated.');

            const list = `${shipped.slice(0, 3).join(', ')}${shipped.length > 3 ? ', …' : ''}`;
            if (english)
              core.setFailed(
                `Package code changed (${list}) and CHANGELOG.md did, but Website/i18n/ru/CHANGELOG.md did not. ` +
                'Add the same entry under [Unreleased] in Website/i18n/ru/CHANGELOG.md: the docs check needs both changelogs to match.');
            else if (russian)
              core.setFailed(
                `Package code changed (${list}) and Website/i18n/ru/CHANGELOG.md did, but the English CHANGELOG.md did not. ` +
                'Add the same entry under [Unreleased] in CHANGELOG.md: scripts/set-version.sh and the package changelog read it.');
            else
              core.setFailed(
                `Package code changed (${list}) but neither CHANGELOG.md nor Website/i18n/ru/CHANGELOG.md did. ` +
                'Add the same entry under [Unreleased] in both, or the `no-changelog` label if users see no change.');
