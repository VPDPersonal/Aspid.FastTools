name: Docs

# Builds the Docusaurus site in Website/ and publishes it to GitHub Pages.
# Content lives in Website/ (docs, tutorials, i18n) plus the root README.md and CHANGELOG*.md,
# so any change there rebuilds the site.

on:
  push:
    branches: [main]
    # The pull_request trigger reuses this list.
    paths: &paths
      - 'Website/**'
      - 'README.md'
      - 'docs/images/readme-previews/**'
      - 'Aspid.FastTools/Packages/tech.aspid.fasttools/Samples~/*/Documentation/**'
      - 'Aspid.FastTools/Packages/tech.aspid.fasttools/README.md'
      - 'Aspid.FastTools/Packages/tech.aspid.fasttools/package.json'
      - 'scripts/frame-doc-captures.sh'
      - 'Aspid.FastTools/Packages/tech.aspid.fasttools/Samples~/README*.md'
      - 'CHANGELOG*.md'
      - '.github/workflows/docs.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

# Deploys queue in one group so none is cancelled halfway; a PR build only competes with newer pushes to its own PR.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # A deploy needs the full history: Docusaurus and sync-changelog read each page's "Last updated" date from git log,
      # which needs only commits and trees, so the blob filter skips the old DLLs and media.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 0 }}
          filter: blob:none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Website/package-lock.json
      - run: npm ci
        working-directory: Website
      - run: npm run check-readme
        working-directory: Website
      - run: npm run check-translations
        working-directory: Website
      - run: node --test scripts/*.test.mjs
        working-directory: Website
      - run: npm run build
        working-directory: Website
      - run: npm run check-selectors
        working-directory: Website
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: Website/build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
