name: Docs

# Builds the Docusaurus site in Website/ and publishes it to GitHub Pages.
# Content comes from the package (Documentation/ and Samples~/*/Documentation/) and the root CHANGELOG*.md,
# so any change there rebuilds the site.

on:
  push:
    branches: [main]
    paths:
      - 'Website/**'
      - 'README.md'
      - 'Aspid.FastTools/Packages/tech.aspid.fasttools/Documentation/**'
      - 'Aspid.FastTools/Packages/tech.aspid.fasttools/Samples~/*/Documentation/**'
      - 'CHANGELOG*.md'
      - 'Aspid.FastTools/Packages/tech.aspid.fasttools/CHANGELOG.md'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'Website/**'
      - 'README.md'
      - 'Aspid.FastTools/Packages/tech.aspid.fasttools/Documentation/**'
      - 'Aspid.FastTools/Packages/tech.aspid.fasttools/Samples~/*/Documentation/**'
      - 'CHANGELOG*.md'
      - 'Aspid.FastTools/Packages/tech.aspid.fasttools/CHANGELOG.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

# Deploys queue in one group so none is cancelled halfway; a PR build only competes with newer pushes to its own PR.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # A deploy needs the full history: Docusaurus and sync-i18n read each page's "Last updated" date from git log,
      # which needs only commits and trees, so the blob filter skips the old DLLs and media.
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 0 }}
          filter: blob:none
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Website/package-lock.json
      - run: npm ci
        working-directory: Website
      - run: npm run check-readme
        working-directory: Website
      - run: node --test scripts/*.test.mjs
        working-directory: Website
      - run: npm run build
        working-directory: Website
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: Website/build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
