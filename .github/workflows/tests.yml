name: Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet-tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Generators
            path: Aspid.FastTools.Generators
            project: Aspid.FastTools.Generators/Aspid.FastTools.Generators
          - name: Analyzers
            path: Aspid.FastTools.Analyzers
            project: Aspid.FastTools.Analyzers/Aspid.FastTools.Analyzers/Aspid.FastTools.Analyzers
          # The SerializeReference YAML engine and its NUnit tests, compiled from the package sources without Unity.
          - name: YAML engine
            path: Aspid.FastTools.YamlTests
    steps:
      - uses: actions/checkout@v4

      # The test projects target net6.0; the SDK pinned in global.json builds them,
      # the 6.0 runtime (installed via the 6.0.x SDK) runs them.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: 6.0.x

      - name: Run ${{ matrix.name }} tests
        run: dotnet test "${{ matrix.path }}" --nologo

      # A Release build re-deploys the DLL into the package (Directory.Build.targets); a clean diff proves
      # the committed DLL was built from these sources, as the release workflow requires.
      - name: Verify the committed ${{ matrix.name }} DLL
        if: matrix.project != ''
        run: |
          set -euo pipefail
          dotnet build "${{ matrix.project }}" -c Release --nologo
          DLL="Aspid.FastTools/Packages/tech.aspid.fasttools/Aspid.FastTools.${{ matrix.name }}.dll"
          if ! git diff --exit-code --stat -- "$DLL"; then
            echo "::error file=$DLL::$DLL is stale. Run 'dotnet build ${{ matrix.project }} -c Release' and commit the DLL."
            exit 1
          fi

  # Secrets are unavailable to fork PRs and until the owner adds them; the Unity job is then skipped, not failed.
  unity-license:
    name: Unity license
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -n "$UNITY_LICENSE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::UNITY_LICENSE is not available; the Unity EditMode tests are skipped."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

  # Compiles the package, its tests and all samples in a throwaway project and runs the EditMode tests, on the
  # minimum Unity that package.json promises and on the dev project's version.
  unity-tests:
    name: Unity EditMode (${{ matrix.name }})
    needs: unity-license
    if: needs.unity-license.outputs.available == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum
            unity: 6000.0.64f1
          - name: dev project
            unity: project
    steps:
      - uses: actions/checkout@v4

      - name: Create the test project
        id: project
        env:
          UNITY: ${{ matrix.unity }}
        run: echo "unity=$(scripts/make-unity-test-project.sh ci-unity-project "$UNITY")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ci-unity-project/Library
          key: unity-library-${{ steps.project.outputs.unity }}-${{ hashFiles('Aspid.FastTools/Packages/tech.aspid.fasttools/**') }}
          restore-keys: unity-library-${{ steps.project.outputs.unity }}-

      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ steps.project.outputs.unity }}
          projectPath: ci-unity-project
          testMode: editmode
          artifactsPath: unity-test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity EditMode results (${{ steps.project.outputs.unity }})

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-test-results-${{ steps.project.outputs.unity }}
          path: unity-test-results
