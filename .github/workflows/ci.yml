name: CI

# Every required check of the Main ruleset except the PR title and CHANGELOG checks (pr-checks.yml): cheap repository
# checks, the .NET tests and the Unity EditMode tests. No job has a path filter: a workflow skipped by a filter reports
# nothing, and a required check that never reports blocks the pull request. The Unity plan job reads the changed files
# itself and still reports.

on:
  pull_request:
    # The default types plus the label events, so that adding or removing `unity-quick` reruns the checks. A label that
    # pr-checks.yml sets with GITHUB_TOKEN starts no workflow; any label a person changes reruns all of them.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  # A maintainer starts it on a branch of this repository, for a commit whose PR cannot run the Unity tests itself
  # (a fork or Dependabot PR without Unity secrets). Here the Unity tests always run and are not skipped.
  workflow_dispatch:
  # release.yml runs every check and test on the commit it publishes; there the Unity tests may not be skipped.
  workflow_call:
    inputs:
      require-unity:
        description: 'Fail instead of skipping the Unity tests when the Unity account secrets are unavailable.'
        type: boolean
        default: false
    secrets:
      UNITY_EMAIL:
        required: false
      UNITY_PASSWORD:
        required: false

permissions:
  contents: read

# PR runs share one group per branch and cancel each other. A push to main or a release (workflow_call) gets one group
# per commit: a group keeps only one pending run, so a shared group would cancel the run of a commit in the middle.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A file without a .meta, a guid used twice, a sample or asmdef reference that leads nowhere: Unity repairs these in a
  # local package and ignores or breaks them in the installed one.
  package-files:
    name: Package files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts
            Aspid.FastTools/Packages/tech.aspid.fasttools
            Aspid.FastTools/Assets/DevTests~
            Aspid.FastTools/Assets/DevTools
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/check-package-files.mjs

  # The version files that scripts/set-version.sh writes (release.yml runs this job too), and the minimum
  # Unity version that the files with a hand-written copy still agree on.
  versions:
    name: Version files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github
            scripts
            skills
            Aspid.FastTools/Packages/tech.aspid.fasttools
            Website/docs/Images
            Website/i18n/ru/docusaurus-plugin-content-docs/current
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/check-version.mjs
      - run: node scripts/check-unity-minimum.mjs

  # The tests of scripts/*.test.mjs. They run set-version.sh on a copy, and set-version.sh regenerates the root README
  # with the dependencies of Website/, so they install them.
  script-tests:
    name: Script tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts
            Aspid.FastTools.Analyzers
            Aspid.FastTools/Packages/tech.aspid.fasttools
            Website/scripts
            Website/docs/Images
            Website/i18n/ru/docusaurus-plugin-content-docs/current
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Website/package-lock.json
      - run: npm ci
        working-directory: Website
      - run: node --test scripts/*.test.mjs

  # A change to a generator or an analyzer reaches Unity only through the DLL in the package. A Release build rewrites
  # both DLLs there (the CopyToUnity targets); a clean `git diff` shows that the committed ones come from these sources.
  roslyn-dlls:
    name: Roslyn DLLs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            Aspid.FastTools.Generators
            Aspid.FastTools.Analyzers
            Aspid.FastTools/Packages/tech.aspid.fasttools
      # The SDK pinned in global.json built the committed DLLs.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # Delete them first: a build that stops copying a DLL into the package then shows as a deleted file in the diff,
      # instead of leaving the committed one in place.
      - name: Rebuild both DLLs in Release
        run: |
          rm -f Aspid.FastTools/Packages/tech.aspid.fasttools/Aspid.FastTools.Generators.dll Aspid.FastTools/Packages/tech.aspid.fasttools/Aspid.FastTools.Analyzers.dll
          dotnet build Aspid.FastTools.Generators/Aspid.FastTools.Generators -c Release --nologo
          dotnet build Aspid.FastTools.Analyzers/Aspid.FastTools.Analyzers/Aspid.FastTools.Analyzers -c Release --nologo
      - name: Compare with the committed DLLs
        run: |
          if ! git diff --exit-code -- 'Aspid.FastTools/Packages/tech.aspid.fasttools/*.dll'; then
            echo "::error::A committed Roslyn DLL differs from a Release build of its sources. Run 'dotnet build -c Release' in Aspid.FastTools.Generators and Aspid.FastTools.Analyzers with the SDK of global.json, then commit the DLLs."
            exit 1
          fi

  # Every SKILL.md of the repository: frontmatter, `metadata.internal` outside skills/, AFT codes, namespaces.
  # A PR that removes an analyzer code but touches no skill must still be checked against the skills.
  skills:
    name: SKILL.md files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Not sparse: the check reads every SKILL.md, the analyzer sources and the package sources.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund js-yaml@4
      - run: node scripts/check-skills.mjs

  # WCAG contrast of the Editor palette: text against the background it sits on, on both skins, read from the USS.
  contrast:
    name: Editor palette contrast
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts
            Aspid.FastTools/Packages/tech.aspid.fasttools/Editor
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/check-contrast.mjs

  dotnet-tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Generators
            path: Aspid.FastTools.Generators
          - name: Analyzers
            path: Aspid.FastTools.Analyzers
          # The SerializeReference YAML engine (on .NET Standard 2.1) and its NUnit tests, compiled from the package
          # sources without Unity.
          - name: YAML engine
            path: DotnetTests/Yaml
          # GenericTypeResolver, GenericArgumentFilter and TypeUtility (on .NET Standard 2.1) and their NUnit tests,
          # compiled from the package sources without Unity.
          - name: Generic type resolver
            path: DotnetTests/Types
    steps:
      # Only what the solutions read: docs/ and Website/ hold most of the repository's size. The analyzer tests embed
      # the docs pages to check the help-link anchors of every AFT rule.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            Aspid.FastTools.Generators
            Aspid.FastTools.Analyzers
            DotnetTests/Yaml
            DotnetTests/Types
            Aspid.FastTools/Packages/tech.aspid.fasttools
            Website/docs

      # The test projects target net6.0; the SDK pinned in global.json builds them,
      # the 6.0 runtime (installed via the 6.0.x SDK) runs them.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: 6.0.x

      - name: Run ${{ matrix.name }} tests
        run: dotnet test "${{ matrix.path }}" --nologo

  # Runs the Unity tests only for a change that can affect them and only with a license to run them.
  # The required "Unity" check must not be green when a change that reaches the Unity tests was not run through them:
  # a PR without the secrets (a fork PR, or a Dependabot PR, which reads its own secret store), a release (require-unity)
  # and a manual run fail the plan instead of skipping. A maintainer then reads the change and runs this workflow with
  # workflow_dispatch on a branch of this repository; for Dependabot PRs the owner can also add UNITY_EMAIL and
  # UNITY_PASSWORD as Dependabot secrets. The failed PR check stays red after a manual run: the maintainer merges with
  # the bypass of the Main ruleset. Only a push without the secrets (a fork's own push) skips with a notice.
  # A PR with the `unity-quick` label tests only the first and the last version of UNITY_VERSIONS: the minimum still
  # catches a newer API, the newest line a removed one. The push to main after the merge runs every version.
  # A PR push after a commit whose Unity tests passed skips them when it changes nothing they read; see the plan step.
  # Secrets: UNITY_EMAIL and UNITY_PASSWORD of a Unity account with a Personal license; GameCI activates a seat with
  # them in each job. Do not add the .ulf from Unity Hub (UNITY_LICENSE): it is bound to the Hub machine, and on
  # 6000.0.53f1 GameCI keeps retrying it instead of falling back to the account.
  unity-plan:
    name: Unity plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.plan.outputs.run }}
      versions: ${{ steps.plan.outputs.versions }}
    steps:
      - id: plan
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          REQUIRE_UNITY: ${{ inputs.require-unity }}
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          # The branch, not base.sha: the base.sha of a PR moves only when its head does, so a label event reads an old one.
          BASE: ${{ github.event.pull_request.base.ref }}
          QUICK: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'unity-quick') }}
          # Every Unity 6000.x line: the minimum that package.json promises, then the newest patch of each later line.
          # The first version is the minimum of package.json: scripts/check-unity-minimum.mjs checks it.
          UNITY_VERSIONS: 6000.0.53f1 6000.1.17f1 6000.2.15f1 6000.3.26f1 6000.4.12f1 6000.5.11f1 6000.6.5f1
        run: |
          read -ra versions <<<"$UNITY_VERSIONS"
          if [ "$QUICK" = true ]; then
            versions=("${versions[0]}" "${versions[-1]}")
          fi
          echo "versions=$(jq -cn '$ARGS.positional' --args "${versions[@]}")" >> "$GITHUB_OUTPUT"

          # What the Unity jobs read: the package except its Markdown, and their own setup.
          relevant='^(Aspid\.FastTools/Packages/tech\.aspid\.fasttools/|scripts/make-unity-test-project\.sh$|\.github/workflows/ci\.yml$)'

          # "all" when the changed files are unknown: a release, a new branch, a failed API call, a truncated list.
          files=all
          if [ "$REQUIRE_UNITY" != true ]; then
            if [ "$EVENT" = pull_request ]; then
              files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')" || files=all
            elif [ "$EVENT" = push ] && [ -n "${BEFORE//0/}" ]; then
              # The compare API lists at most 300 files.
              files="$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" --jq '.files[].filename')" || files=all
              [ "$(wc -l <<<"$files")" -lt 300 ] || files=all
            fi
          fi

          reaches_unity() { grep -vE '\.md(\.meta)?$' | grep -qE "$relevant"; }
          changed() { gh api "repos/$GITHUB_REPOSITORY/compare/$1...$2" --jq '.files[].filename'; }

          # A PR commit whose Unity tests already passed on every version of this plan holds for the head too when no
          # later change reaches them: a push of docs or a CHANGELOG line, a label event. The newest of the last 20 PR
          # commits with a run of these tests decides. A failed run there is not looked past; a cancelled or missing
          # one is (an older push cancelled by a newer one, a version that only a run without `unity-quick` tests).
          # A rebase leaves no tested commit in the PR, and a merge of main brings its changes into the diff.
          # Only jobs of a ci.yml run of this repository count: a fork PR can add a workflow with jobs of these names
          # that pass without testing, then delete it in a later commit, and its runs stay on the SHA. Only a run with
          # the Unity secrets looks, so a fork or Dependabot PR still fails the plan for a change that reaches the tests.
          passed=""
          if [ "$EVENT" = pull_request ] && [ "$files" != all ] && [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; then
            for sha in $(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/commits?per_page=100" --jq '.[].sha' | tail -n 20 | tac); do
              runs="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&per_page=100" --jq '.workflow_runs[]
                | select(.path == ".github/workflows/ci.yml" and .head_repository.full_name == "'"$GITHUB_REPOSITORY"'") | "\(.id) \(.created_at)"')" || runs=""
              tested_at="$(sort -k2 <<<"$runs" | head -n 1 | cut -d' ' -f2)"
              verdict="$(for run in $(cut -d' ' -f1 <<<"$runs"); do
                gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?filter=all&per_page=100" --jq '.jobs[]'
              done | jq -rs '
                (group_by(.name) | map({key: .[0].name, value: (max_by(.id).conclusion // "pending")}) | from_entries) as $latest
                | [$ARGS.positional[] | $latest["Unity EditMode (\(.))"] // "none"]
                | if any(.[]; . == "failure" or . == "timed_out") then "failed"
                  elif all(.[]; . == "success") then "passed"
                  else "unknown" end' --args "${versions[@]}")"
              [ "$verdict" = unknown ] && continue
              # A run tests the merge with main as it was when the oldest of these runs was created, so the main commits
              # merged since count too. The compare API lists at most 300 files.
              if [ "$verdict" = passed ] \
                && tested_base="$(gh api "repos/$GITHUB_REPOSITORY/commits?sha=$BASE&until=$tested_at&per_page=1" --jq '.[0].sha')" \
                && later="$(changed "$sha" "$HEAD")" && main_later="$(changed "$tested_base" "$BASE")" \
                && [ "$(wc -l <<<"$later")" -lt 300 ] && [ "$(wc -l <<<"$main_later")" -lt 300 ] \
                && ! reaches_unity <<<"$later"$'\n'"$main_later"; then
                passed="$sha"
              fi
              break
            done
          fi

          if [ "$files" != all ] && ! reaches_unity <<<"$files"; then
            echo "No change reaches the Unity tests; they are skipped."
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$passed" ]; then
            echo "::notice::The Unity tests passed on ${passed:0:8} and no later change reaches them; they are skipped."
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            if [ "$REQUIRE_UNITY" = true ] || [ "$EVENT" = workflow_dispatch ]; then
              echo "::error::UNITY_EMAIL or UNITY_PASSWORD is not available; the Unity EditMode tests must run here."
              exit 1
            elif [ "$EVENT" = pull_request ]; then
              echo "::error::The Unity EditMode tests must run for this change, but this run has no Unity secrets (a fork or Dependabot PR). A maintainer must run them after reading the change, because the Unity Editor executes its code with the Unity account secrets: push this commit to a branch of this repository and start the CI workflow on that branch (Actions > CI > Run workflow). If this check stays red after a green manual run, merge with the bypass of the Main ruleset."
              exit 1
            fi
            echo "::notice::UNITY_EMAIL or UNITY_PASSWORD is not available; the Unity EditMode tests are skipped."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            [ "$QUICK" != true ] || echo "::notice::The unity-quick label is set; only Unity ${versions[*]} are tested."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  # Compiles the package, its tests, its Math assembly and all samples in a throwaway project and runs the EditMode
  # tests on every version of UNITY_VERSIONS in the plan job (only the first and the last with `unity-quick`).
  # A line without a version is not tested: Unity changes APIs and behaviour without a define (see #319 and #325).
  # Each version needs a GameCI image (unityci/editor). Add a version to UNITY_VERSIONS when a new Unity line ships.
  # The tests include PlayerCompilationTests, which compiles every script for a standalone player: the Editor compile
  # alone accepts a UnityEditor call in Runtime/ that breaks the user's player build. The job is part of the required
  # "Unity" check below.
  # There is no Library cache: it saves at most the first import (25-50 s), and 6000.6 was SIGKILLed with a restored one.
  unity-tests:
    name: Unity EditMode (${{ matrix.unity }})
    needs: unity-plan
    if: needs.unity-plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Both passes take 5-6 minutes; the rest is room for a slow image pull and an activation retry.
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        unity: ${{ fromJSON(needs.unity-plan.outputs.versions) }}
    env:
      UNITY_VERSION: ${{ matrix.unity }}
      # The game-ci CLI that game-ci/unity-test-runner v4.4.0 runs, pinned by version and archive checksum. No name
      # here starts with GAME_CI: the CLI reads such variables as its own options and stops on unknown ones.
      GAMECI_VERSION: v0.1.72
      GAMECI_SHA256: 1de550a620ee92e05e920b6db7d431621440b60b2577f04b4a997dc92a58cb0a
    steps:
      # What the test project reads: the package and the script that builds the project.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            Aspid.FastTools/Packages/tech.aspid.fasttools
            scripts

      - name: Create the test project
        run: scripts/make-unity-test-project.sh ci-unity-project "$UNITY_VERSION"

      - name: Download the game-ci CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$RUNNER_TEMP/game-ci"
          gh release download "$GAMECI_VERSION" --repo game-ci/cli --pattern game-ci-linux-x64.tar.gz --dir "$dir"
          echo "$GAMECI_SHA256  $dir/game-ci-linux-x64.tar.gz" | sha256sum --check --quiet
          tar -xzf "$dir/game-ci-linux-x64.tar.gz" -C "$dir"
          echo "GAMECI=$dir/game-ci" >> "$GITHUB_ENV"

      # Two passes on one Personal seat. The runner has no GPU: Unity draws through llvmpipe (software OpenGL under
      # xvfb), where UI tests run up to 250 times slower than on a GPU. So every test that opens no window runs under
      # -nographics, and only the fixtures of the Graphics category, which need a shown window, run with a graphics
      # device. The second pass reuses the Library of the first.
      # The seat is activated once and returned once: every activation is a login to the Unity account, which allows
      # only a few in a short time ("User reaches maximum same user attempt retry count", 143.002), and a second
      # activation seconds after a return often gets no seat. game-ci mounts $HOME as /root in each container, so the
      # passes find the license that `game-ci activate` left there.
      # Unity sometimes assigns no seat at all when many jobs activate the same account at once, or assigns one and then
      # fails to write the license file ("User token expired") while game-ci still reports success. So an activation
      # counts only with the line about the updated license file; otherwise it gets one more attempt after a pause.
      - id: activate
        name: Activate a Unity Personal seat
        env: &unity-account
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          log="$RUNNER_TEMP/activate.log"
          for attempt in 1 2; do
            "$GAMECI" activate --engine=unity ci-unity-project --engineVersion="$UNITY_VERSION" \
              --targetPlatform=StandaloneLinux64 2>&1 | tee "$log"
            if grep -q "Successfully updated UnityEntitlementLicense.xml" "$log"; then
              exit 0
            fi
            if [ "$attempt" = 1 ]; then
              echo "::warning::The activation failed; trying once more after a pause."
              sleep $((60 + RANDOM % 60))
            fi
          done
          exit 1

      # A pass without a results file broke before its tests ran: 6000.6 is sometimes SIGKILLed (137) as it opens the
      # Library of the first pass, as it was with a restored Library cache. It gets one more try on a fresh Library
      # and the same seat. The exit code does not tell a broken run from failed tests: game-ci exits 1 for both.
      # PlayerCompilationTests fails on a missing player support or com.unity.mathematics only with
      # -aspidFastToolsStrictSetup. The project has no Code Coverage package, so coverage is off: it only added
      # -debugCodeOptimization. Both container variables go in one --dockerEnv, one per line: of repeated
      # --dockerEnv flags the CLI keeps only the last.
      - id: nographics
        name: EditMode tests without graphics
        env:
          PASS: nographics
          PASS_PARAMETERS: -nographics -testCategory !Graphics
        run: &unity-pass |
          run_pass() {
            "$GAMECI" test --docker --engine=unity ci-unity-project --testPlatforms=editmode \
              --engineVersion="$UNITY_VERSION" --artifactsPath="unity-test-results/$PASS" \
              --customParameters="-aspidFastToolsStrictSetup $PASS_PARAMETERS" \
              --dockerEnv="$(printf 'SKIP_ACTIVATION=true\nCOVERAGE_ENABLED=false')"
          }
          results="unity-test-results/$PASS/editmode-results.xml"
          # Unity 6000.6 keeps a Data Store in Library/DataStore, an LMDB database whose lock files hold the process ids
          # of the container that wrote them. Each container starts its process ids anew, so the second pass drops
          # the lock files of the first; LMDB writes new ones. The retry below still covers a kill.
          sudo rm -f ci-unity-project/Library/DataStore/uds.lock ci-unity-project/Library/DataStore/uds.db-lock
          code=0
          run_pass || code=$?
          if [ ! -f "$results" ]; then
            echo "::warning::Unity EditMode $PASS broke (exit code $code); trying once more on a fresh Library."
            # Whether the runner killed Unity for memory: 6000.6 loses its Editor or its script compiler this way.
            echo "::group::Memory after the broken pass"
            free -m
            df -h /dev/shm
            sudo dmesg | grep -iE "killed process|out of memory|oom" | tail -20 || true
            echo "::endgroup::"
            sudo rm -rf ci-unity-project/Library "unity-test-results/$PASS"
            code=0
            run_pass || code=$?
          fi
          echo "exit-code=$code" >> "$GITHUB_OUTPUT"
          [ -f "$results" ] && echo "results=true" >> "$GITHUB_OUTPUT" || echo "results=false" >> "$GITHUB_OUTPUT"

      - id: graphics
        name: EditMode tests with graphics
        env:
          PASS: graphics
          PASS_PARAMETERS: -testCategory Graphics
        run: *unity-pass

      # Also after a failed or cancelled pass, and after a failed activation that may still hold a seat: a seat that
      # is never returned stays taken and breaks the next runs on the account. The log line decides, not the exit
      # code: game-ci v0.1.72 returns the seat and then exits 1, since its build check finds no build output.
      - name: Return the Unity seat
        if: always() && steps.activate.outcome != 'skipped'
        continue-on-error: true
        env: *unity-account
        run: |
          log="$RUNNER_TEMP/return-license.log"
          "$GAMECI" return-license --engine=unity ci-unity-project --engineVersion="$UNITY_VERSION" \
            --targetPlatform=StandaloneLinux64 2>&1 | tee "$log"
          if ! grep -q "Successfully returned the entitlement license" "$log"; then
            echo "::warning::The Unity seat may still be taken; see the return log above."
            exit 1
          fi

      - name: Summarize the test results
        if: always()
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          lines = [f"### Unity EditMode {os.environ['UNITY_VERSION']}", "",
                   "| Pass | Result | Total | Passed | Failed | Skipped | Time |", "|---|---|---|---|---|---|---|"]
          failed = []
          for name in ("nographics", "graphics"):
              path = f"unity-test-results/{name}/editmode-results.xml"
              if not os.path.exists(path):
                  lines.append(f"| {name} | no results | | | | | |")
                  continue
              run = ET.parse(path).getroot()
              lines.append(f"| {name} | {run.get('result')} | {run.get('total')} | {run.get('passed')} | "
                           f"{run.get('failed')} | {run.get('skipped')} | {float(run.get('duration')):.0f} s |")
              failed += [case.get("fullname") for case in run.iter("test-case") if case.get("result") == "Failed"]
          if failed:
              lines += ["", f"Failed tests ({len(failed)}):", ""] + [f"- `{name}`" for name in failed[:50]]
          for name in failed[:10]:
              print(f"::error title=Unity {os.environ['UNITY_VERSION']}::{name}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          PY

      - name: Fail on a failed test run
        if: always() && steps.activate.outcome == 'success'
        env:
          NOGRAPHICS: ${{ steps.nographics.outputs.exit-code }}:${{ steps.nographics.outputs.results }}
          GRAPHICS: ${{ steps.graphics.outputs.exit-code }}:${{ steps.graphics.outputs.results }}
        run: |
          status=0
          for pass in "without graphics:$NOGRAPHICS" "with graphics:$GRAPHICS"; do
            IFS=: read -r name code results <<<"$pass"
            if [ "$code" = 0 ] && [ "$results" = true ]; then
              continue
            elif [ "$results" = true ]; then
              echo "::error::Unity EditMode $name: some tests failed; see the summary."
            else
              echo "::error::Unity EditMode $name broke before it wrote results (exit code ${code:-none})."
            fi
            status=1
          done
          exit $status

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: unity-test-results-${{ matrix.unity }}
          path: unity-test-results

  # The one Unity check that the main ruleset requires. A skipped matrix job reports no per-version names,
  # so a required "Unity EditMode (…)" check would wait forever; this job always reports.
  unity:
    name: Unity
    needs: [unity-plan, unity-tests]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          PLAN: ${{ needs.unity-plan.result }}
          RUN: ${{ needs.unity-plan.outputs.run }}
          TESTS: ${{ needs.unity-tests.result }}
        run: |
          if [ "$PLAN" != success ]; then
            echo "::error::Unity plan: $PLAN."
            exit 1
          fi
          if [ "$RUN" = true ] && [ "$TESTS" != success ]; then
            echo "::error::Unity EditMode: $TESTS."
            exit 1
          fi
          echo "Unity EditMode: $TESTS."
