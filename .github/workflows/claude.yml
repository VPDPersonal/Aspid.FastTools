name: Claude

# Two jobs:
# - review: one automatic review when a PR opens or leaves draft.
#   We do not review every push to save subscription limits.
#   Ask for a new review with an @claude comment.
# - mention: answers @claude comments in PRs and issues.
#   A requested review also leaves inline comments.
#   Comments from bots are ignored, so Claude's own replies do not start it again.
#
# Both jobs append .github/claude-review.md to the system prompt.
# A step reads the file before the action switches to the PR branch:
# older PR branches may not have the file yet.
#
# Auth: CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token` (Pro/Max subscription).

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  review:
    # Fork PRs get no secrets; Dependabot PRs are not worth the tokens.
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Read review rules
        id: rules
        run: |
          {
            echo 'text<<CLAUDE_RULES_EOF'
            cat .github/claude-review.md
            echo 'CLAUDE_RULES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Review PR
        uses: anthropics/claude-code-action@v1
        env:
          # The action reads this variable and appends it to the system prompt.
          APPEND_SYSTEM_PROMPT: ${{ steps.rules.outputs.text }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

  mention:
    if: |
      github.event.sender.type != 'Bot' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Read review rules
        id: rules
        run: |
          {
            echo 'text<<CLAUDE_RULES_EOF'
            cat .github/claude-review.md
            echo 'CLAUDE_RULES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        env:
          # The action reads this variable and appends it to the system prompt.
          APPEND_SYSTEM_PROMPT: ${{ steps.rules.outputs.text }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          # The inline comment tool lets a requested review put issues on their lines.
          # git diff and git fetch let Claude see what the PR changed against its base.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(git diff:*),Bash(git fetch:*)"
