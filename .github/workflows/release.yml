name: Release

# Publishes a release for a pushed v* tag. Everything is checked before anything is published:
# first the cheap checks (preflight), then every test (tests.yml); the upm branch and the UPM tag
# then go out in one atomic push (release), and the GitHub release is created last, in its own job (github-release).
# If a job fails, use "Re-run failed jobs", not "Re-run all jobs": the finished jobs are kept, and preflight would
# refuse the UPM tag that the first run already published.
# There is no manual run: the "Release tags" ruleset lets only admins create, move or delete v* tags, and a personal
# repository cannot add the workflow token to the bypass list, so the workflow could not push the tag itself.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  PACKAGE_PATH: Aspid.FastTools/Packages/tech.aspid.fasttools
  CHANGELOG_PATH: CHANGELOG.md
  GENERATORS_SOLUTION_DIR: Aspid.FastTools.Generators
  ANALYZERS_SOLUTION_DIR: Aspid.FastTools.Analyzers

jobs:
  # The cheap checks run first, so a wrong ref, version, CHANGELOG or stale DLL fails before the Unity matrix starts.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      upm-branch: ${{ steps.version.outputs.upm-branch }}
      notes: ${{ steps.notes.outputs.notes }}

    steps:
      - name: Determine version
        id: version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version '$VERSION' is not a valid SemVer string."
            exit 1
          fi
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=true
            UPM_BRANCH=upm-preview
          else
            PRERELEASE=false
            UPM_BRANCH=upm
          fi
          # Validated as SemVer above, so the later steps and the release job can read these.
          {
            echo "VERSION=$VERSION"
            echo "TAG=v$VERSION"
            echo "PRERELEASE=$PRERELEASE"
            echo "UPM_BRANCH=$UPM_BRANCH"
          } >> "$GITHUB_ENV"
          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "prerelease=$PRERELEASE"
            echo "upm-branch=$UPM_BRANCH"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A v* tag can be pushed on any commit, for example one of an open PR. Only a commit that main already contains
      # is published. This catches a mistake, not abuse: the workflow file comes from the tagged commit.
      - name: Check the commit is in main
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::Commit $(git rev-parse --short HEAD) is not in main. Delete the tag, merge the commit into main, then tag the merge commit."
            exit 1
          fi
          echo "Commit $(git rev-parse --short HEAD) is in main."

      - name: Check the UPM tag does not already exist
        run: |
          set -euo pipefail
          # The pushed v* tag is the trigger itself; only the UPM tag must be new.
          T="$UPM_BRANCH/$VERSION"
          if git rev-parse --verify --quiet "refs/tags/$T" >/dev/null; then
            echo "::error::Tag $T already exists locally. Delete it or pick another version."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "$T" >/dev/null 2>&1; then
            echo "::error::Tag $T already exists on origin. Refusing to overwrite a published tag."
            exit 1
          fi

      - name: Validate package.json version
        run: |
          set -euo pipefail
          PKG_VERSION=$(jq -r .version "$PACKAGE_PATH/package.json")
          if [[ "$PKG_VERSION" != "$VERSION" ]]; then
            echo "::error file=$PACKAGE_PATH/package.json::package.json version ($PKG_VERSION) does not match release version ($VERSION). Bump it before tagging."
            exit 1
          fi
          echo "package.json version matches: $PKG_VERSION"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # The version files must carry the whole version and its channel (badge label, #upm or #upm-preview URLs).
      - name: Validate documentation version
        run: node scripts/check-version.mjs

      - name: Extract CHANGELOG section
        id: notes
        run: |
          set -euo pipefail
          NOTES=$(awk -v ver="$VERSION" '
            BEGIN { capture = 0 }
            /^## \[/ {
              if (capture) { exit }
              if ($0 ~ "^## \\[" ver "\\]([^0-9A-Za-z.-]|$)") { capture = 1; next }
            }
            capture { print }
          ' "$CHANGELOG_PATH")

          if [[ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]]; then
            echo "::error file=$CHANGELOG_PATH::No CHANGELOG section found for version $VERSION. Add a '## [$VERSION] — YYYY-MM-DD' heading before releasing."
            exit 1
          fi

          {
            echo 'notes<<RELEASE_NOTES_EOF'
            printf '%s\n' "$NOTES"
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"
          echo "CHANGELOG section for $VERSION extracted ($(echo "$NOTES" | wc -l) lines)."

      # The SDK pinned in global.json builds the DLLs, the same one that built the committed ones.
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Rebuilding in Release re-deploys both DLLs into the package checkout
      # (Directory.Build.targets); a clean `git diff` then proves the committed
      # DLLs were built from the sources being released.
      - name: Verify committed Roslyn DLLs match sources
        run: |
          set -euo pipefail
          dotnet build "$GENERATORS_SOLUTION_DIR/Aspid.FastTools.Generators" -c Release --nologo
          dotnet build "$ANALYZERS_SOLUTION_DIR/Aspid.FastTools.Analyzers/Aspid.FastTools.Analyzers" -c Release --nologo
          GENERATORS_DLL="$PACKAGE_PATH/Aspid.FastTools.Generators.dll"
          ANALYZERS_DLL="$PACKAGE_PATH/Aspid.FastTools.Analyzers.dll"
          if ! git diff --exit-code -- "$GENERATORS_DLL" "$ANALYZERS_DLL"; then
            echo "::error::Committed Roslyn DLLs do not match a fresh Release build of the sources. Rebuild with the SDK pinned in global.json ('dotnet build -c Release' in $GENERATORS_SOLUTION_DIR and $ANALYZERS_SOLUTION_DIR) and commit the updated DLLs before releasing."
            exit 1
          fi
          echo "Committed Roslyn DLLs match a fresh Release build."

  # Every test of Tests on the commit being released; here missing Unity secrets fail instead of skipping Unity.
  tests:
    name: Tests
    needs: preflight
    uses: ./.github/workflows/tests.yml
    with:
      require-unity: true
    secrets:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    permissions:
      contents: read
      pull-requests: read
      checks: write

  release:
    needs: [preflight, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      TAG: ${{ needs.preflight.outputs.tag }}
      PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
      UPM_BRANCH: ${{ needs.preflight.outputs.upm-branch }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # The package CHANGELOG.md and its .meta are not in git. They are generated and committed here, so the subtree
      # split below publishes them. The commit stays in this runner: the release tag points at $GITHUB_SHA.
      - name: Generate package CHANGELOG
        run: |
          set -euo pipefail
          node scripts/package-changelog.mjs "$TAG"
          git add --force "$PACKAGE_PATH/CHANGELOG.md" "$PACKAGE_PATH/CHANGELOG.md.meta"
          git commit --quiet -m "chore(release): generate the package CHANGELOG for $TAG"

      # One atomic push: the upm branch and the UPM tag are both published, or neither is.
      - name: Publish UPM subtree
        run: |
          set -euo pipefail
          UPM_TAG="$UPM_BRANCH/$VERSION"
          SPLIT_SHA=$(git subtree split --prefix="$PACKAGE_PATH" HEAD)
          echo "Subtree split SHA: $SPLIT_SHA"
          git tag "$UPM_TAG" "$SPLIT_SHA"
          git push --atomic origin "+$SPLIT_SHA:refs/heads/$UPM_BRANCH" "refs/tags/$UPM_TAG"
          echo "Published $UPM_TAG and the $UPM_BRANCH branch."

  # The gh CLI instead of a third-party action, which would run with this job's contents: write token.
  # A separate job: the tags are out when it starts, so a failure here is repaired with "Re-run failed jobs",
  # which runs only this job. Creating the release by hand works too:
  #   gh release create v<version> --verify-tag --title v<version> --prerelease=<true|false> \
  #     --notes-file <the version's section of CHANGELOG.md>
  github-release:
    name: GitHub release
    needs: [preflight, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.preflight.outputs.tag }}
      PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
      NOTES: ${{ needs.preflight.outputs.notes }}

    steps:
      # No checkout: --verify-tag asks the GitHub API whether the tag is out.
      - name: Create GitHub release
        run: |
          set -euo pipefail
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease="$PRERELEASE"
