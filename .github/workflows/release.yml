name: Release

# Publishes a release: a pushed v* tag, a manual run on main, or a merge into main that changes the package version
# (a release PR from scripts/prepare-release.mjs). A main push whose version is already tagged does nothing.
# Everything is checked before anything is published: the tags and the upm branch go out in one atomic push,
# then the GitHub release is created from the changelog section.

on:
  push:
    tags:
      - 'v*'
    branches: [main]
    # Not evaluated for tag pushes.
    paths:
      - 'Aspid.FastTools/Packages/tech.aspid.fasttools/package.json'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.0 or 1.0.0-rc.2). The leading "v" is added automatically.'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  PACKAGE_PATH: Aspid.FastTools/Packages/tech.aspid.fasttools
  CHANGELOG_PATH: CHANGELOG.md
  GENERATORS_SOLUTION_DIR: Aspid.FastTools.Generators
  ANALYZERS_SOLUTION_DIR: Aspid.FastTools.Analyzers

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "::error::Run the release from main, not $GITHUB_REF."
              exit 1
            fi
            VERSION="$INPUT_VERSION"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION=$(jq -r .version "$PACKAGE_PATH/package.json")
          fi
          VERSION="${VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version '$VERSION' is not a valid SemVer string."
            exit 1
          fi
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_TYPE" == "branch" ]] \
             && git ls-remote --exit-code --tags origin "$TAG" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG is already released; nothing to do."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Releasing $TAG"
          fi

  release:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    # The version job validated these as SemVer; the scripts read them from the environment.
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      UPM_BRANCH: ${{ needs.version.outputs.prerelease == 'true' && 'upm-preview' || 'upm' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check tags do not already exist
        run: |
          set -euo pipefail
          # A pushed v* tag is the trigger itself; only the UPM tag must be new then.
          TAGS=("$UPM_BRANCH/$VERSION")
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            TAGS+=("$TAG")
          fi
          for T in "${TAGS[@]}"; do
            if git rev-parse --verify --quiet "refs/tags/$T" >/dev/null; then
              echo "::error::Tag $T already exists locally. Delete it or pick another version."
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "$T" >/dev/null 2>&1; then
              echo "::error::Tag $T already exists on origin. Refusing to overwrite a published tag."
              exit 1
            fi
          done

      - name: Validate package.json version
        run: |
          set -euo pipefail
          PKG_VERSION=$(jq -r .version "$PACKAGE_PATH/package.json")
          if [[ "$PKG_VERSION" != "$VERSION" ]]; then
            echo "::error file=$PACKAGE_PATH/package.json::package.json version ($PKG_VERSION) does not match release version ($VERSION). Bump it before tagging."
            exit 1
          fi
          echo "package.json version matches: $PKG_VERSION"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The version files must carry the whole version and its channel (badge label, #upm or #upm-preview URLs);
      # the same script checks every pull request.
      - name: Validate documentation version
        run: node scripts/check-changes.mjs

      - name: Extract CHANGELOG section
        run: |
          set -euo pipefail
          NOTES=$(awk -v ver="$VERSION" '
            BEGIN { capture = 0 }
            /^## \[/ {
              if (capture) { exit }
              if ($0 ~ "^## \\[" ver "\\]([^0-9A-Za-z.-]|$)") { capture = 1; next }
            }
            capture { print }
          ' "$CHANGELOG_PATH")

          if [[ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]]; then
            echo "::error file=$CHANGELOG_PATH::No CHANGELOG section found for version $VERSION. Add a '## [$VERSION] — YYYY-MM-DD' heading before releasing."
            exit 1
          fi

          echo "$NOTES" > "$RUNNER_TEMP/release-notes.md"
          echo "CHANGELOG section for $VERSION extracted ($(echo "$NOTES" | wc -l) lines)."

      - name: Verify package CHANGELOG is in sync
        run: |
          set -euo pipefail
          PKG_CHANGELOG="$PACKAGE_PATH/CHANGELOG.md"
          if [[ ! -f "$PKG_CHANGELOG" ]]; then
            echo "Package CHANGELOG.md does not exist yet; skipping sync check."
            exit 0
          fi
          if ! diff -u "$CHANGELOG_PATH" "$PKG_CHANGELOG"; then
            echo "::error file=$PKG_CHANGELOG::Package CHANGELOG.md is out of sync with the root $CHANGELOG_PATH. Sync them before releasing."
            exit 1
          fi
          echo "Package CHANGELOG.md matches the root $CHANGELOG_PATH."

      # The test projects target net6.0; the SDK pinned in global.json builds them,
      # the 6.0 runtime (installed via the 6.0.x SDK) runs them.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: '6.0.x'

      # Tests run in Debug on purpose: the Directory.Build.targets deploy of the Roslyn
      # DLLs into the Unity package is Release-only, so a Debug test run can never
      # interfere with the DLL freshness verification below.
      - name: Run generator tests
        run: dotnet test --nologo
        working-directory: ${{ env.GENERATORS_SOLUTION_DIR }}

      - name: Run analyzer tests
        run: dotnet test --nologo
        working-directory: ${{ env.ANALYZERS_SOLUTION_DIR }}

      # Rebuilding in Release re-deploys both DLLs into the package checkout
      # (Directory.Build.targets); a clean `git diff` then proves the committed
      # DLLs were built from the sources being released.
      - name: Verify committed Roslyn DLLs match sources
        run: |
          set -euo pipefail
          dotnet build "$GENERATORS_SOLUTION_DIR/Aspid.FastTools.Generators" -c Release --nologo
          dotnet build "$ANALYZERS_SOLUTION_DIR/Aspid.FastTools.Analyzers/Aspid.FastTools.Analyzers" -c Release --nologo
          GENERATORS_DLL="$PACKAGE_PATH/Aspid.FastTools.Generators.dll"
          ANALYZERS_DLL="$PACKAGE_PATH/Aspid.FastTools.Analyzers.dll"
          if ! git diff --exit-code -- "$GENERATORS_DLL" "$ANALYZERS_DLL"; then
            echo "::error::Committed Roslyn DLLs do not match a fresh Release build of the sources. Rebuild with the SDK pinned in global.json ('dotnet build -c Release' in $GENERATORS_SOLUTION_DIR and $ANALYZERS_SOLUTION_DIR) and commit the updated DLLs before releasing."
            exit 1
          fi
          echo "Committed Roslyn DLLs match a fresh Release build."

      # One atomic push: the upm branch, the UPM tag and the release tag are all published, or none of them is.
      - name: Publish release tag and UPM subtree
        run: |
          set -euo pipefail
          UPM_TAG="$UPM_BRANCH/$VERSION"
          SPLIT_SHA=$(git subtree split --prefix="$PACKAGE_PATH" HEAD)
          echo "Subtree split SHA: $SPLIT_SHA"
          git tag "$UPM_TAG" "$SPLIT_SHA"
          REFS=("+$SPLIT_SHA:refs/heads/$UPM_BRANCH" "refs/tags/$UPM_TAG")
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            git tag -a "$TAG" -m "Release $TAG"
            REFS+=("refs/tags/$TAG")
          fi
          git push --atomic origin "${REFS[@]}"
          echo "Published $TAG, $UPM_TAG and the $UPM_BRANCH branch."

      # The gh CLI instead of a third-party action, which would run with this job's contents: write token.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FLAGS=()
          if [[ "$PRERELEASE" == "true" ]]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" "${FLAGS[@]}"
