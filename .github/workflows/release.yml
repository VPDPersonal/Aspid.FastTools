name: Release

# Publishes a release for a pushed v* tag. Everything is checked before anything is published:
# first the checks of the tag (preflight), then every check and test of a pull request (ci.yml, Unity not skipped);
# the upm and skills branches and their tags then go out in one atomic push (release), and the GitHub release is
# created last, in its own job (github-release).
# If a job fails, use "Re-run failed jobs", not "Re-run all jobs": the finished jobs are kept, and preflight would
# refuse the UPM and skills tags that the first run already published.
# There is no manual run: the "Release tags" ruleset lets only admins create, move or delete v* tags, and a personal
# repository cannot add the workflow token to the bypass list, so the workflow could not push the tag itself.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  PACKAGE_PATH: Aspid.FastTools/Packages/tech.aspid.fasttools
  CHANGELOG_PATH: CHANGELOG.md
  # The consumer skills go out as a subtree too: `npx skills add VPDPersonal/Aspid.FastTools#skills/<version>`
  # clones only them, not the whole repository. Every version, preview or stable, moves the one skills branch.
  SKILLS_PATH: skills
  SKILLS_BRANCH: skills

jobs:
  # The tag checks run first, so a wrong ref, version or CHANGELOG fails before CI starts. The version files and the
  # committed DLLs are checked in CI, as in every pull request.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      upm-branch: ${{ steps.version.outputs.upm-branch }}
      notes: ${{ steps.notes.outputs.notes }}

    steps:
      - name: Determine version
        id: version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version '$VERSION' is not a valid SemVer string."
            exit 1
          fi
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=true
            UPM_BRANCH=upm-preview
          else
            PRERELEASE=false
            UPM_BRANCH=upm
          fi
          # Validated as SemVer above, so the later steps and the release job can read these.
          {
            echo "VERSION=$VERSION"
            echo "TAG=v$VERSION"
            echo "PRERELEASE=$PRERELEASE"
            echo "UPM_BRANCH=$UPM_BRANCH"
          } >> "$GITHUB_ENV"
          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "prerelease=$PRERELEASE"
            echo "upm-branch=$UPM_BRANCH"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A v* tag can be pushed on any commit, for example one of an open PR. Only a commit that main already contains
      # is published. This catches a mistake, not abuse: the workflow file comes from the tagged commit.
      - name: Check the commit is in main
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::Commit $(git rev-parse --short HEAD) is not in main. Delete the tag, merge the commit into main, then tag the merge commit."
            exit 1
          fi
          echo "Commit $(git rev-parse --short HEAD) is in main."

      - name: Check the UPM and skills tags do not already exist
        run: |
          set -euo pipefail
          # The pushed v* tag is the trigger itself; only the UPM and skills tags must be new.
          for T in "$UPM_BRANCH/$VERSION" "$SKILLS_BRANCH/$VERSION"; do
            if git rev-parse --verify --quiet "refs/tags/$T" >/dev/null; then
              echo "::error::Tag $T already exists locally. Delete it or pick another version."
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "$T" >/dev/null 2>&1; then
              echo "::error::Tag $T already exists on origin. Refusing to overwrite a published tag."
              exit 1
            fi
          done

      # The subtree split publishes skills/ as it is, and `npx skills add` finds a skill by its SKILL.md.
      # CI checks the skills themselves (check-skills.mjs); this catches a release without them.
      - name: Check the skills folder
        run: |
          set -euo pipefail
          COUNT=$(git ls-tree -r --name-only HEAD -- "$SKILLS_PATH" | grep -c '/SKILL.md$' || true)
          if [[ "$COUNT" -eq 0 ]]; then
            echo "::error::$SKILLS_PATH/ has no SKILL.md, so the $SKILLS_BRANCH/$VERSION tag would have no skills."
            exit 1
          fi
          echo "$SKILLS_PATH/ has $COUNT skills."

      - name: Validate package.json version
        run: |
          set -euo pipefail
          PKG_VERSION=$(jq -r .version "$PACKAGE_PATH/package.json")
          if [[ "$PKG_VERSION" != "$VERSION" ]]; then
            echo "::error file=$PACKAGE_PATH/package.json::package.json version ($PKG_VERSION) does not match release version ($VERSION). Bump it before tagging."
            exit 1
          fi
          echo "package.json version matches: $PKG_VERSION"

      - name: Extract CHANGELOG section
        id: notes
        run: |
          set -euo pipefail
          NOTES=$(awk -v ver="$VERSION" '
            BEGIN { capture = 0 }
            /^## \[/ {
              if (capture) { exit }
              if ($0 ~ "^## \\[" ver "\\]([^0-9A-Za-z.-]|$)") { capture = 1; next }
            }
            capture { print }
          ' "$CHANGELOG_PATH")

          if [[ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]]; then
            echo "::error file=$CHANGELOG_PATH::No CHANGELOG section found for version $VERSION. Add a '## [$VERSION] — YYYY-MM-DD' heading before releasing."
            exit 1
          fi

          {
            echo 'notes<<RELEASE_NOTES_EOF'
            printf '%s\n' "$NOTES"
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"
          echo "CHANGELOG section for $VERSION extracted ($(echo "$NOTES" | wc -l) lines)."

  # Every check and test of CI on the commit being released; here missing Unity secrets fail instead of skipping Unity.
  ci:
    name: CI
    needs: preflight
    uses: ./.github/workflows/ci.yml
    with:
      require-unity: true
    secrets:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    permissions:
      contents: read
      pull-requests: read
      checks: write

  release:
    needs: [preflight, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      TAG: ${{ needs.preflight.outputs.tag }}
      PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
      UPM_BRANCH: ${{ needs.preflight.outputs.upm-branch }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # The package CHANGELOG.md and its .meta are not in git. They are generated and committed here, so the subtree
      # split below publishes them. The commit stays in this runner: the release tag points at $GITHUB_SHA.
      - name: Generate package CHANGELOG
        run: |
          set -euo pipefail
          node scripts/package-changelog.mjs "$TAG"
          git add --force "$PACKAGE_PATH/CHANGELOG.md" "$PACKAGE_PATH/CHANGELOG.md.meta"
          git commit --quiet -m "chore(release): generate the package CHANGELOG for $TAG"

      # One atomic push: the upm and skills branches and their tags are all published, or none is.
      - name: Publish UPM and skills subtrees
        run: |
          set -euo pipefail
          UPM_TAG="$UPM_BRANCH/$VERSION"
          SKILLS_TAG="$SKILLS_BRANCH/$VERSION"
          UPM_SHA=$(git subtree split --prefix="$PACKAGE_PATH" HEAD)
          SKILLS_SHA=$(git subtree split --prefix="$SKILLS_PATH" HEAD)
          echo "UPM subtree split SHA: $UPM_SHA"
          echo "Skills subtree split SHA: $SKILLS_SHA"
          git tag "$UPM_TAG" "$UPM_SHA"
          git tag "$SKILLS_TAG" "$SKILLS_SHA"
          git push --atomic origin \
            "+$UPM_SHA:refs/heads/$UPM_BRANCH" "refs/tags/$UPM_TAG" \
            "+$SKILLS_SHA:refs/heads/$SKILLS_BRANCH" "refs/tags/$SKILLS_TAG"
          echo "Published $UPM_TAG, $SKILLS_TAG and the $UPM_BRANCH and $SKILLS_BRANCH branches."

  # The gh CLI instead of a third-party action, which would run with this job's contents: write token.
  # A separate job: the tags are out when it starts, so a failure here is repaired with "Re-run failed jobs",
  # which runs only this job. Creating the release by hand works too:
  #   gh release create v<version> --verify-tag --title v<version> --prerelease=<true|false> \
  #     --notes-file <the version's section of CHANGELOG.md>
  github-release:
    name: GitHub release
    needs: [preflight, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.preflight.outputs.tag }}
      PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
      NOTES: ${{ needs.preflight.outputs.notes }}

    steps:
      # No checkout: --verify-tag asks the GitHub API whether the tag is out.
      - name: Create GitHub release
        run: |
          set -euo pipefail
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease="$PRERELEASE"
