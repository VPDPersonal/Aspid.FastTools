name: Package files

on:
  pull_request:
    paths:
      - 'Aspid.FastTools/Packages/tech.aspid.fasttools/**'
      - 'Aspid.FastTools/Assets/DevTests/**'
      - 'scripts/check-package-files.mjs'
      - '.github/workflows/package-files.yml'
  push:
    branches: [main]
    paths:
      - 'Aspid.FastTools/Packages/tech.aspid.fasttools/**'
      - 'Aspid.FastTools/Assets/DevTests/**'
      - 'scripts/check-package-files.mjs'
      - '.github/workflows/package-files.yml'

jobs:
  files:
    name: Path length and .meta importers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/check-package-files.mjs
