name: Release checklist
description: Pre-publish QA checklist for an Asset Store / UPM release of Aspid.FastTools.
title: "Release X.Y.Z — pre-publish checklist"
labels: ["type: chore"]
body:
  - type: markdown
    attributes:
      value: |
        Tick every box before publishing. Anything left unchecked in **§1 Blockers** must be resolved first.
        Replace `X.Y.Z` in the title with the target version. The checks of the release PR cover what can be automated: the .NET tests, the committed Roslyn DLLs, the package files, the version files, the Unity EditMode tests on every 6000.x line (CI) and the site build with `check-readme` (Docs). The Release workflow runs CI again on the tag. This list holds what CI cannot check.

  - type: input
    id: version
    attributes:
      label: Target version
      description: The version being released (must match `package.json` `version` and the `CHANGELOG` section).
      placeholder: "1.0.0"
    validations:
      required: true

  - type: checkboxes
    id: blockers
    attributes:
      label: 1. Release blockers
      description: Hard gates — release cannot ship until all are checked.
      options:
        - label: "`package.json` `version` bumped to the release version with `scripts/set-version.sh X.Y.Z` (no `-rc`/`-preview` suffix for a stable release)"
        - label: "Stable release: the badge reads `Release X.Y.Z` and the install URLs use `#upm` (`scripts/set-version.sh` switches them from `Preview` / `#upm-preview`; the Release workflow checks it)"
        - label: "The `[Unreleased]` section of `CHANGELOG.md` and `Website/i18n/ru/CHANGELOG.md` closed into `[X.Y.Z]` with a date (`scripts/set-version.sh` does it)"
        - label: "Everything merged into `main`; a pushed `vX.Y.Z` tag starts the Release workflow, which publishes the `upm*/X.Y.Z` and `skills/X.Y.Z` tags and the GitHub release. A stable release PR merges only after §12, the Asset Store publication, and its tag follows at once: the stable version reaches GitHub only after the store"
        - label: All checks of the release PR are green

  - type: checkboxes
    id: environment
    attributes:
      label: 0. Test environment
      description: Cover the install paths and Unity versions a buyer will use.
      options:
        - label: Clean project on minimum Unity **6000.0.53f1** — imports with 0 errors / 0 warnings
        - label: "Installed from the Asset Store (**My Assets → Install**, the UPM product): the package lands in the **Packages** list, not in `Assets/`, and the Test Runner lists no FastTools tests"
        - label: Installed via UPM `upm` git tag (stable)
        - label: Installed via UPM `upm-preview` branch (preview) — README badge links resolve
        - label: Tested **with** and **without** `com.unity.mathematics` present

  - type: checkboxes
    id: manifest
    attributes:
      label: 2. Package integrity & manifest
      options:
        - label: "`documentationUrl` / `licensesUrl` / `changelogUrl` all resolve (no 404)"
        - label: "`LICENSE.md` (MIT) present in the package and matches the manifest"
        - label: "No stray files shipped (`.csproj`, `bin/`, `obj/`, `.vs/`, test scenes, generator **source**)"
        - label: Generator and analyzer DLLs present, flagged as RoslynAnalyzer (not a platform managed plugin)

  - type: checkboxes
    id: compilation
    attributes:
      label: 3. Compilation & builds
      options:
        - label: Player build passes on **Mono** and **IL2CPP** (Runtime/ ⊄ UnityEditor boundary holds)
        - label: Non-development build (`ENABLE_PROFILER` off) — ProfilerMarker dispatcher compiles via `#if` fallback `return default;`
        - label: IL2CPP stripping keeps reflection paths `SerializableType` needs (AQN resolution works on an AOT build)
        - label: At least one standalone (Win/Mac) **and** one AOT target (iOS/Android/WebGL) built

  - type: checkboxes
    id: generators
    attributes:
      label: 4. Source generators
      options:
        - label: "ProfilerMarkersGenerator — unique marker per (type, method, line); `.WithName(literal)` & `$\"...\"` work; same-line dedup"

  - type: checkboxes
    id: mathematics
    attributes:
      label: 5. Optional Mathematics integration
      options:
        - label: Without `com.unity.mathematics` — compiles; no errors; Math satellite built only on Unity 6000.5+
        - label: With `com.unity.mathematics` — satellite compiles; `SetValue`/`ValueChanged` for `float2/3/4`, `int2/3/4` available
        - label: Installing / removing the package while the Editor is open leaves no broken references

  - type: checkboxes
    id: features
    attributes:
      label: 6. Feature smoke (in editor)
      options:
        - label: "SerializableType / SerializableType<T> — inspector serialization, lazy resolve, TypeSelector (search/hierarchy), `ComponentTypeSelector`, survives domain reload"
        - label: "EnumValues<TValue> — plain enum and `[Flags]`, add/remove, persistence"
        - label: "VisualElement fluent API — layout/size/style/borders/colors/transitions/callbacks/USS/child; `*If` variants; `BindTo`/`UnbindFrom`; `SetLabel` overloads"
        - label: Internal editor components (AspidLabel/Box/GradientButton/HelpBox/InspectorHeader/AnimatedLogo…) render, USS applies, animations run
        - label: "Welcome Window (`Tools/Aspid 🐍/FastTools/Welcome`) opens, reads `package.json`, sample-import buttons work; first-import auto-show fires once"

  - type: checkboxes
    id: samples
    attributes:
      label: 7. Samples (via Package Manager)
      description: For each of EnumValues, Types, SerializeReferences, EditorTools, ProfilerMarkers.
      options:
        - label: Each imports through PM into `Assets/Samples/...`
        - label: Scenes/demos open — no pink materials, no Missing Script
        - label: "Manifest `displayName`/`description`/`path` match the real folders"

  - type: checkboxes
    id: uss
    attributes:
      label: 8. USS / visuals
      options:
        - label: USS class names follow BEM (`asp-ft-editor-component` skill)
        - label: Base palette `Aspid-FastTools-Default-Dark.uss` loads first; `--aspid-icons-*` resolve
        - label: Checked in Dark and Light editor theme — no unreadable text

  - type: checkboxes
    id: docs
    attributes:
      label: 9. Documentation
      options:
        - label: "Site docs (`Website/docs/`, `Website/tutorials/`, their `Website/i18n/ru/` twins) and the short sample READMEs match the API"
        - label: The package README links the site, and the unpacked package has no images outside `Editor/Resources`
        - label: "`SETUP.md` matches a fresh install from **My Assets**: the install steps, the menu paths and the minimum Unity version of `package.json`"
        - label: The version badge renders and links the `vX.Y.Z` release
        - label: Asset Store card screenshots proofread (no typos)

  - type: checkboxes
    id: assetstore
    attributes:
      label: 10. Asset Store upload setup
      description: The portal, the tool and the Editor are fixed in the `asp-ft-release` skill, section "Asset Store upload". Set up here while the release PR is open, upload after 11, merge and tag after 12.
      options:
        - label: "The upload goes to the UPM Publisher Portal (`cloud.unity.com/assetstore/publisher/products`, product `fastTools`), whose technical name `tech.aspid.fasttools` matches `package.json`; not to the `.unitypackage` portal `publisher.unity.com`"
        - label: "The Editor that uploads is **6000.0.53f1** (the minimum in `package.json`), not the dev project's 6000.6: the portal records the uploading Editor version, which can list buyers on older 6000.x as unsupported"
        - label: "The package in the upload project comes from the head of `chore/release-X.Y.Z` with `CHANGELOG.md` and its `.meta` generated (`node scripts/package-changelog.mjs vX.Y.Z`); no other PR that changes the package or the CHANGELOGs merges into `main` until the release PR does"
        - label: "Asset Store UPM Publishing Tools (`com.unity.upm-publishing-tools`, from My Assets) installed; Validator with Validation Type **UPM** run on the package: no failures. A warning about types outside a namespace for `ProfilerMarkerExtensionsForGenerator` (the generator finds it by name) is expected: name that type in the submission notes"
        - label: "Uploaded from the **UPM Packages** tab of the Uploader; the portal's package metadata lists every compatible `6000.x` and the version's CHANGELOG section as release notes"

  - type: checkboxes
    id: final
    attributes:
      label: 11. Final smoke before upload
      options:
        - label: In the upload project — clean console, one sample imports from the **Samples** tab and runs, the Test Runner lists no FastTools tests
        - label: "Asset Store card (version, Unity compatibility, category, license, tags) matches the package"

  - type: checkboxes
    id: publish
    attributes:
      label: 12. After the upload, before the merge and the tag
      options:
        - label: "Submitted with **Manually publish**; after the approval, published in the portal"
        - label: Fresh install from **My Assets** into an empty project — clean console, the package is in the **Packages** list
        - label: "The `## [X.Y.Z] — <date>` heading of both CHANGELOGs carries the publication day; then the release PR is merged and `vX.Y.Z` is tagged"
