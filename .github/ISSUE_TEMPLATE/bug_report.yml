name: Bug report
description: Report a bug or unexpected behavior in Aspid.FastTools.
labels: ["type: fix"]
body:
  - type: textarea
    id: actual
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps so the bug can be reproduced locally.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: unity-version
    attributes:
      label: Unity version
      placeholder: "6000.0.x"
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: Aspid.FastTools version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installed from
      options:
        - Asset Store
        - UPM git, upm (stable)
        - UPM git, upm-preview (preview)
        - Other
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where it happens
      multiple: true
      options:
        - Editor
        - Player build, Mono
        - Player build, IL2CPP
  - type: textarea
    id: logs
    attributes:
      label: Console log
      description: Errors and stack traces from the Unity console.
      render: text
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, related issues — anything that helps.
