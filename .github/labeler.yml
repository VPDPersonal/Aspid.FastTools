# area: * labels from the changed paths, applied by .github/workflows/pr-labels.yml.
'area: runtime':
  - changed-files:
      - any-glob-to-any-file: 'Aspid.FastTools/Packages/tech.aspid.fasttools/Runtime/**'
'area: editor':
  - changed-files:
      - any-glob-to-any-file: 'Aspid.FastTools/Packages/tech.aspid.fasttools/Editor/**'
'area: generator':
  - changed-files:
      - any-glob-to-any-file:
          - 'Aspid.FastTools.Generators/**'
          - 'Aspid.FastTools.Analyzers/**'
          - 'Aspid.FastTools/Packages/tech.aspid.fasttools/*.dll'
'area: samples':
  - changed-files:
      - any-glob-to-any-file: 'Aspid.FastTools/Packages/tech.aspid.fasttools/Samples~/**'
'area: docs':
  - changed-files:
      - any-glob-to-any-file:
          - 'Website/**'
          - 'README*.md'
          - 'CHANGELOG*.md'
          - 'Aspid.FastTools/Packages/tech.aspid.fasttools/Documentation/**'
          - 'Aspid.FastTools/Packages/tech.aspid.fasttools/Samples~/*/Documentation/**'
'area: ci':
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - '.githooks/**'
          - 'scripts/**'
          - 'Aspid.FastTools.YamlTests/**'
'area: claude':
  - changed-files:
      - any-glob-to-any-file:
          - '.claude/**'
          - 'skills/**'
          - 'AGENTS.md'
          - 'CLAUDE.md'
